<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Signal lost · Somashekar Reddy Nakka</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07080a; color: #eeebe4; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 1.25rem; padding: 2rem 1rem; text-align: center; }
  .code { font: 500 12px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: .14em; text-transform: uppercase; color: #8d95a3; }
  h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 6rem); line-height: .95; letter-spacing: -.04em; font-weight: 600; }
  p { margin: 0 auto; max-width: 34ch; color: #b9bec8; }
  a { justify-self: center; color: #07080a; background: #eeebe4; padding: .85rem 1.4rem; border-radius: 999px; text-decoration: none; font-weight: 600; }
  a:focus-visible { outline: 2px solid #5b7cff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <span class="code">Error 404 · No lock on this path</span>
  <h1>Signal lost.</h1>
  <p>This page does not exist. The portfolio itself is one step away.</p>
  <a id="home" href="/">Return to the portfolio</a>
</main>
<script>
  // Fallback when the build did not know its URL: on GitHub Pages project sites the app lives under /<repo>/.
  if (!document.currentScript.hasAttribute('data-base-known') && location.hostname.endsWith('github.io')) {
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (seg) document.getElementById('home').setAttribute('href', '/' + seg + '/');
  }
</script>
</body>
</html>
